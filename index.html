<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Jackson Khuto" />
    <meta name="theme-color" content="#0B0E11" />
    <meta name="color-scheme" content="dark" />

    <!-- Per-page title, description, canonical, Open Graph, Twitter and JSON-LD are injected here at build time (scripts/prerender.mjs). -->
    <!--app-head-->

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0E11'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' text-anchor='middle' fill='%23EDEDE8'%3Ejk%3Ctspan fill='%23C9803D'%3E.%3C/tspan%3E%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/profile.jpg" />

    <!-- Fonts load without blocking the first paint; system fonts show until they arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
      <!-- Without JavaScript, scroll-reveal content must still be visible. -->
      <style>.reveal{opacity:1!important;transform:none!important}</style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
